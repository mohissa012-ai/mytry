name: Deals to Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deals-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Install browser
        run: playwright install --with-deps chromium

      - name: Run bot (~5 minutes, checks every minute)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MINUTES: "4.5"
          CHECK_EVERY_SECONDS: "60"
          ELECTRONICS_ONLY: "false"
          USE_BROWSER: "true"
        run: python deals_to_telegram.py

      - name: Save seen deals
        if: always()
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add seen_deals.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update seen deals"
            git pull --rebase
            git push
          fi
