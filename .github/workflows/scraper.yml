name: Amazon Resale Deal Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deals-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore seen deals
        uses: actions/cache@v4
        with:
          path: seen_deals.json
          key: deals-state-${{ github.run_id }}
          restore-keys: |
            deals-state-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          camoufox fetch

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_BROWSER: "true"
          CAMOUFOX_HEADLESS: "true"
          DRY_RUN: "false"
          RUN_MINUTES: "4.5"
          CHECK_EVERY_SECONDS: "60"
        run: python deals_scraper.py
